<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bouquet Pro</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b1020"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bouquet Pro">
<style>
:root{--bg:#0b1020;--card:#151c33;--card2:#1b2442;--txt:#eef1fb;--mut:#9aa6c8;--a:#7c5cff;--b:#22d3ee}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6}
.hero{padding:44px 20px 36px;text-align:center;background:radial-gradient(900px 400px at 80% -10%,#7c5cff55,transparent),radial-gradient(700px 400px at 10% 0,#22d3ee33,transparent)}
.logo{display:inline-block;font-weight:800;font-size:15px;letter-spacing:.5px;padding:6px 14px;border-radius:99px;background:#ffffff14;border:1px solid #ffffff22;margin-bottom:16px}
h1{font-size:28px;margin:0 0 10px;line-height:1.3}
.hero p{color:var(--mut);margin:0 auto;max-width:520px}
.badge{display:inline-flex;gap:6px;margin-top:18px;padding:8px 14px;border-radius:12px;background:#22c55e22;color:#7ee2a0;font-size:13px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 40px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:2}
.tab{white-space:nowrap;padding:9px 16px;border-radius:99px;background:var(--card);color:var(--mut);border:1px solid #ffffff14;font-size:14px;cursor:pointer;font-family:inherit}
.tab.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}h1{font-size:38px}}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid #ffffff12;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:12px}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
.card h3{margin:0;font-size:18px}.tag{font-size:12px;color:var(--mut)}
.price{font-size:22px;font-weight:800}.price small{font-size:12px;color:var(--mut);font-weight:400}
ul{margin:0;padding:0 18px;color:var(--mut);font-size:14px}
.btn{margin-top:auto;display:block;text-align:center;text-decoration:none;color:#fff;padding:12px;border-radius:14px;font-weight:700;background:linear-gradient(135deg,var(--a),var(--b))}
.note{margin:24px 0;padding:14px 16px;border-radius:14px;background:#ffffff0d;color:var(--mut);font-size:13px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px 16px 40px}
.lang{position:absolute;top:14px;left:14px;display:flex;gap:6px}.lang button{background:#ffffff14;color:var(--txt);border:1px solid #ffffff22;border-radius:10px;padding:5px 10px;font-size:12px;cursor:pointer}.lang button.on{background:var(--a)}.hero{position:relative}[dir=ltr] .tabs{direction:ltr}
</style></head><body>
<header class="hero"><div class="lang" id="lang"><button data-l="ar" class="on">ع</button><button data-l="fr">FR</button><button data-l="en">EN</button></div>
<div class="logo">📺 Bouquet Pro</div>
<h1 id="h1"></h1><p id="sub"></p><div class="badge" id="bdg"></div></header>
<main class="wrap"><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div><div class="note" id="note"></div></main>
<footer id="foot"></footer>

let L=(location.hash.slice(1)||localStorage.getItem('bp_l')||'ar'),F='all';
function r(){const x=T[L];document.documentElement.lang=L;document.documentElement.dir=x.dir;

tabs.innerHTML=Object.keys(x.tabs).map(k=>`<button class="tab${k==F?' on':''}" data-f="${k}">${x.tabs[k]}</button>`).join('');

grid.innerHTML=D.filter(d=>F=='all'||d.t==F).map(d=>{const p=x.p[d.k];return `<div class="card"><div class="top"><div class="ic" style="background:${d.c}">${d.i}</div><div><h3>${d.n}</h3><div class="tag">${d.s[L]}</div></div></div><div class="price">${p[0]} <small>${p[1]}</small></div><ul>${p[2].map(y=>'<li>'+y+'</li>').join('')}</ul><a class="btn" target="_blank" rel="noopener" href="${d.h}">${x.btn}</a></div>`}).join('')}
