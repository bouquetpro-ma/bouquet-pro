<style>
:root{--bg:#0b1020;--card:#151c33;--card2:#1b2442;--txt:#eef1fb;--mut:#9aa6c8;--a:#7c5cff;--b:#22d3ee}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6}
button,input,select,textarea{font-family:inherit}
.hero{position:relative;overflow:hidden;padding:84px 20px 44px;text-align:center;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero video,.hero .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hero:after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,#0b102099 0%,#0b1020cc 70%,var(--bg) 100%),radial-gradient(700px 300px at 80% 0,#7c5cff44,transparent)}
.hero>*:not(video):not(.poster):not(.top){position:relative;z-index:2}
.logo{display:inline-flex;align-items:center;font-weight:800;font-size:15px;letter-spacing:.5px;padding:6px 14px;border-radius:99px;background:#ffffff1a;border:1px solid #ffffff2a;margin-bottom:16px;backdrop-filter:blur(6px)}
h1{font-size:28px;margin:0 0 10px;line-height:1.3;text-shadow:0 2px 12px #0008}
.hero p{color:#d5dcf2;margin:0 auto;max-width:520px}
.badge{display:inline-flex;gap:6px;margin-top:18px;padding:8px 14px;border-radius:12px;background:#22c55e30;color:#8cf0b0;font-size:13px}
.wab{display:inline-flex;gap:8px;align-items:center;gap:8px;margin-top:16px;padding:12px 22px;border-radius:14px;background:#25d366;color:#06310f;font-weight:800;text-decoration:none}
.top{position:absolute;top:12px;left:12px;right:12px;z-index:3;display:flex;justify-content:space-between;gap:8px;direction:ltr}
.pill{background:#0b102099;color:var(--txt);border:1px solid #ffffff33;border-radius:12px;padding:6px 11px;font-size:13px;cursor:pointer;backdrop-filter:blur(6px)}
.pill.on{background:var(--a);border-color:transparent}
.lang{display:flex;gap:6px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 90px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:5}
.tab{white-space:nowrap;padding:9px 16px;border-radius:99px;background:var(--card);color:var(--mut);border:1px solid #ffffff14;font-size:14px;cursor:pointer}
.tab.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}h1{font-size:38px}}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid #ffffff12;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.ctop{display:flex;align-items:center;gap:12px}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
.card h3{margin:0;font-size:18px}.tag{font-size:12px;color:var(--mut)}
.price{font-size:22px;font-weight:800}.price small{font-size:12px;color:var(--mut);font-weight:400}
ul{margin:0;padding:0 18px;color:var(--mut);font-size:14px}
.btn{margin-top:auto;display:block;text-align:center;text-decoration:none;color:#fff;padding:12px;border-radius:14px;font-weight:700;background:linear-gradient(135deg,var(--a),var(--b));border:0;cursor:pointer;font-size:15px}
.note{margin:24px 0;padding:14px 16px;border-radius:14px;background:#ffffff0d;color:var(--mut);font-size:13px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px 16px 40px}
.fab{position:fixed;bottom:18px;inset-inline-end:16px;z-index:20;width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 6px 20px #0008;text-decoration:none;font-size:28px}
.ico{width:1.2em;height:1.2em;vertical-align:-.2em;flex:none}
.sndb{display:inline-flex;align-items:center;gap:6px}
.fadm{display:inline-flex;align-items:center;gap:6px;color:var(--mut);text-decoration:none;font-size:12px;padding:6px 12px;border:1px solid #ffffff1f;border-radius:99px;margin-top:10px}
.oimg{width:100%;height:150px;object-fit:cover;border-radius:14px;background:#0e1530}
.btn.alt{background:#ffffff14;margin-top:0;border:1px solid #ffffff2a}
.cartb{display:none;align-items:center;gap:8px;position:fixed;bottom:18px;inset-inline-start:16px;z-index:20;padding:0 18px;height:56px;border-radius:28px;border:0;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:800;font-size:15px;box-shadow:0 6px 20px #0008;cursor:pointer;display:none}
#cart{position:fixed;inset:0;z-index:40;background:#000a;display:none;align-items:flex-end;justify-content:center}
#cart.open{display:flex}.cin{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}
.ci{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff14}
.q{display:flex;align-items:center;gap:8px}
/* admin */
.grp{background:#1b1c22;border-radius:22px;margin:0 0 14px;overflow:hidden}
.rw{padding:14px 16px;border-top:1px solid #ffffff10}.rw:first-child{border-top:0}
.rh{display:flex;align-items:center;gap:12px}
.ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.ic svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rt{flex:1;font-size:16px;font-weight:600}
.rw .in{margin-top:10px;background:#0f1015;border-radius:12px}
.chev{width:18px;height:18px;stroke:#8a8d99;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
html[dir=rtl] .chev{transform:scaleX(1)} html[dir=ltr] .chev{transform:scaleX(-1)}
input.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:#3a3b44;position:relative;flex:none;cursor:pointer;margin:0;transition:.2s}
input.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
input.sw:checked{background:#34c759}input.sw:checked::after{inset-inline-start:23px}
.lg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 0}
.lg span{font-size:15px}
.sv{display:block;width:100%;padding:14px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:700;font-size:16px;cursor:pointer;margin-top:6px}

#adm{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:none}
#adm.open{display:block}
.ain{max-width:760px;margin:0 auto;padding:16px 16px 80px}
.ah{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ah h2{margin:0;font-size:20px}
.fld{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}
.in{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #ffffff22;background:#0e1530;color:var(--txt);font-size:15px}
textarea.in{min-height:70px;resize:vertical}
.box{background:var(--card);border:1px solid #ffffff12;border-radius:16px;padding:14px;margin:12px 0}
.vg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.vg b{display:block;font-size:24px}.vg div{background:#0e1530;border-radius:12px;padding:10px;font-size:12px;color:var(--mut)}
.vr{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}.vr span{width:90px}.vr i{flex:1;height:8px;background:#0e1530;border-radius:9px;overflow:hidden}.vr s{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}.vr em{width:70px;font-style:normal;color:var(--mut);text-align:end}
.bars{display:flex;align-items:flex-end;gap:4px;height:70px;margin-top:10px}.bars div{flex:1;background:linear-gradient(var(--b),var(--a));border-radius:4px 4px 0 0;min-height:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sm{padding:7px 12px;border-radius:10px;border:1px solid #ffffff22;background:#0e1530;color:var(--txt);cursor:pointer;font-size:13px}
.sm.red{color:#ff8a8a}
.msg{margin:8px 0;font-size:13px;color:#8cf0b0}
.lbl{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
